<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>پارسیان سرام</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-badge">P</span>
      <span>پارسیان سرام</span>
    </div>
    <div class="topbar-sub">کاتالوگ محصولات (حالت نمایشی آفلاین)</div>
  </header>

  <nav id="categoryTabs" class="tabs"></nav>

  <main id="grid" class="grid"></main>

  <div id="detail" class="detail hidden">
    <button id="backBtn" class="back-btn">→ بازگشت</button>
    <div id="detailGallery" class="detail-gallery"></div>
    <div class="detail-body">
      <div id="detailBrand" class="detail-brand"></div>
      <h1 id="detailName" class="detail-name"></h1>
      <div id="detailPrice" class="detail-price"></div>
      <div id="detailSpecs" class="detail-specs"></div>
      <p id="detailDesc" class="detail-desc"></p>
    </div>
  </div>

  <div class="offline-note">این نسخه نمایشی است و به اینترنت یا سرور نیاز ندارد. برای خرید واقعی از وب‌سایت استفاده کنید.</div>

  <script src="app.js"></script>
</body>
</html>
