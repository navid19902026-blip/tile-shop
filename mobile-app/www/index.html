<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>پارسیان سرام</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar" id="topbar">
    <div class="topbar-row">
      <div class="brand">
        <span class="brand-badge">P</span>
        <span id="brandName">پارسیان سرام</span>
      </div>
      <button id="langBtn" class="lang-btn" type="button">AZ</button>
    </div>
    <div class="topbar-sub" id="topbarSub">کاتالوگ محصولات (حالت نمایشی آفلاین)</div>
  </header>

  <div class="toolbar">
    <span id="resultCount" class="result-count"></span>
    <button id="filterBtn" class="filter-btn" type="button">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
      <span id="filterBtnLabel">فیلترها</span>
      <span id="filterBadge" class="filter-badge hidden">0</span>
    </button>
  </div>

  <main id="grid" class="grid"></main>

  <div id="filterOverlay" class="filter-overlay hidden"></div>
  <div id="filterDrawer" class="filter-drawer">
    <div class="filter-drawer-header">
      <span id="filterTitle">فیلترها</span>
      <button id="filterCloseBtn" class="filter-close" type="button">✕</button>
    </div>
    <div class="filter-drawer-body">
      <div class="filter-section">
        <div class="filter-section-title" id="filterTypeTitle">نوع محصول</div>
        <div id="filterTypeChips" class="chip-row"></div>
      </div>
      <div class="filter-section">
        <div class="filter-section-title" id="filterBrandTitle">برند</div>
        <div id="filterBrandList" class="check-list"></div>
      </div>
      <div class="filter-section">
        <div class="filter-section-title" id="filterSizeTitle">اندازه</div>
        <div id="filterSizeList" class="check-list"></div>
      </div>
    </div>
    <div class="filter-drawer-footer">
      <button id="filterClearBtn" class="filter-clear-btn" type="button"></button>
      <button id="filterApplyBtn" class="filter-apply-btn" type="button"></button>
    </div>
  </div>

  <div id="detail" class="detail hidden">
    <button id="backBtn" class="back-btn"><span id="backArrow">→</span> <span id="backLabel">بازگشت</span></button>
    <div id="detailGallery" class="detail-gallery"></div>
    <div id="galleryDots" class="gallery-dots"></div>
    <div class="detail-body">
      <div id="detailBrand" class="detail-brand"></div>
      <h1 id="detailName" class="detail-name"></h1>
      <div id="detailPrice" class="detail-price"></div>
      <a id="whatsappBtn" class="whatsapp-btn" target="_blank" rel="noopener">
        <svg class="whatsapp-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M17.47 14.38c-.29-.15-1.71-.85-1.98-.94-.27-.1-.46-.15-.66.15-.2.29-.76.94-.93 1.13-.17.2-.34.22-.63.07-.29-.15-1.24-.46-2.36-1.46-.87-.78-1.46-1.74-1.63-2.03-.17-.29-.02-.45.13-.6.13-.13.29-.34.44-.51.15-.17.2-.29.29-.49.1-.2.05-.37-.02-.51-.07-.15-.66-1.59-.9-2.18-.24-.57-.48-.5-.66-.51h-.56c-.2 0-.51.07-.78.37-.27.29-1.02 1-1.02 2.43 0 1.43 1.04 2.82 1.19 3.01.15.2 2.05 3.13 4.97 4.39.69.3 1.23.48 1.65.61.69.22 1.32.19 1.82.11.55-.08 1.71-.7 1.96-1.37.24-.68.24-1.26.17-1.38-.07-.12-.27-.2-.56-.34z"/>
          <path d="M12.02 2C6.5 2 2.02 6.48 2.02 12c0 1.86.51 3.62 1.4 5.12L2 22l5.03-1.38A9.94 9.94 0 0 0 12.02 22C17.53 22 22 17.52 22 12S17.53 2 12.02 2zm0 18.14c-1.66 0-3.2-.48-4.5-1.31l-.32-.2-3.02.83.83-2.94-.21-.33a8.14 8.14 0 0 1-1.28-4.19c0-4.5 3.66-8.16 8.16-8.16S20.18 7.5 20.18 12s-3.66 8.14-8.16 8.14z"/>
        </svg>
        <span id="whatsappLabel">خرید از طریق واتساپ</span>
      </a>
      <div id="detailSpecs" class="detail-specs"></div>
      <p id="detailDesc" class="detail-desc"></p>
    </div>
  </div>

  <div class="offline-note" id="offlineNote"></div>

  <script src="app.js"></script>
</body>
</html>
